name: kaithem
services:

  # This strictly builds the platform-independent wheel.
  # That is why only linux/amd64 is supported
  # Platform specific stuff is installed from uv or apt
  # or cargo in the native-rust-builder
  kaithem-builder:
    restart: "no"
    image: kaithem-builder:${KAITHEM_VERSION:?error}
    build:
      # Expects to be in a projects directory containing
      # Kaithem alongside Dashbeard.
      context: ../../
      dockerfile: KaithemAutomation/docker/build/Dockerfile

  playwright:
    restart: "no"
    image: kaithem-dev-playwright:${KAITHEM_VERSION:?error}
    build:
      context: ../../
      dockerfile: KaithemAutomation/docker/playwright/Dockerfile
    user: "${KAITHEM_UID:?error}:${KAITHEM_GROUP:?error}"

    volumes:
      - ./../../KaithemAutomation:/work

    working_dir: /work
    network_mode: host


  # This is the actual app, the rest are for testing
  kaithem:
    extends:
      file: ./groups.yaml
      service: groups
    restart: "no"
    image: ${IMAGE_PREFIX:-}cooperskeep/kaithem:${KAITHEM_VERSION:?error}
    build:
      context: ../../
      dockerfile: KaithemAutomation/docker/app/Dockerfile
      args:
        - KAITHEM_VERSION=${KAITHEM_VERSION:?error}

    privileged: true

    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99


    user: "${KAITHEM_UID:?error}:${KAITHEM_GROUP:?error}"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PIPEWIRE_REMOTE=pipewire-0
      - USER=${KAITHEM_USER:?error}
      - LOGNAME=${KAITHEM_USER:?error}
      - DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}
      - KAITHEM_AUDIO_API=jack
      - XDG_SESSION_TYPE=${XDG_SESSION_TYPE}
      - XAUTHORITY=${XAUTHORITY}
      - PIPEWIRE_LATENCY="128/48000"
      - PIPEWIRE_QUANTUM="128/48000"

    volumes:
      # Seems to be needed for getpass.getuser()
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/lib/locale:/usr/lib/locale:ro
      - ${XDG_RUNTIME_DIR}:${XDG_RUNTIME_DIR}
      - /var/run/dbus:/var/run/dbus
      - /dev:/dev
      - /tmp:/tmp

      # Use the host certificate bundle so we don't have to keep
      # updating the bundle
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

    tmpfs:
      - /app-home:mode=755,uid=1000,gid=1000,size=512M

    network_mode: host
    pid: host
    # group_add is provided by docker-compose.override.yaml, regenerated by
    # scripts/render-compose-override.sh. Compose merges lists across files, so
    # this field must live in the override only.

  kaithem-dev:
    restart: "no"
    extends:
      service: kaithem
    image: ${IMAGE_PREFIX:-}cooperskeep/kaithem-dev:${KAITHEM_VERSION:?error}
    build:
      context: ../../
      dockerfile: KaithemAutomation/docker/dev/Dockerfile

    environment:
      - PYTHONDEVMODE=1

    volumes:
      # Mount in the Kaithem files, so that we can do dev with it.
      - ./../../KaithemAutomation:/workspace/KaithemAutomation
      - ./../../Dashbeard:/workspace/Dashbeard
      - /workspace/KaithemAutomation/.venv
      - /workspace/KaithemAutomation/.test_venvs
      - /workspace/KaithemAutomation/__pycache__
      - /workspace/KaithemAutomation/wasm_kegs/__pycache__
      - /workspace/Dashbeard/.npm
      - /workspace/Dashbeard/dist
      - /workspace/uv_cache
      - /workspace/KaithemAutomation/.uv
      - /app-home/.cache

  kaithem-kiosk:
    restart: "no"
    image: ${IMAGE_PREFIX:-}cooperskeep/kaithem-kiosk:${KAITHEM_VERSION:?error}
    build:
      context: ../../
      dockerfile: KaithemAutomation/docker/kiosk/Dockerfile
      args:
        - KAITHEM_VERSION=${KAITHEM_VERSION:?error}

    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99

    security_opt:
    - apparmor:unconfined

    user: "${KAITHEM_UID:?error}:${KAITHEM_GROUP:?error}"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PIPEWIRE_REMOTE=pipewire-0
      - USER=${KAITHEM_USER:?error}
      - HOME=/home/${KAITHEM_USER:?error}
      - LOGNAME=${KAITHEM_USER:?error}
      - DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}
      - KAITHEM_AUDIO_API=jack
      - XDG_SESSION_TYPE=${XDG_SESSION_TYPE}
      - XAUTHORITY=${XAUTHORITY}
      - PIPEWIRE_LATENCY="128/48000"
      - PIPEWIRE_QUANTUM="128/48000"
      - KIOSK_URL="${KIOSK_URL:-http://localhost:8002}"

    volumes:
      - /var/run/dbus:/var/run/dbus
      - ${XDG_RUNTIME_DIR}:${XDG_RUNTIME_DIR}
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/lib/locale:/usr/lib/locale:ro

    tmpfs:
      - /dev/shm:size=300M,mode=1777

    network_mode: host

    # group_add is provided by docker-compose.override.yaml, regenerated by
    # scripts/render-compose-override.sh. Compose merges lists across files, so
    # this field must live in the override only.

  kaithem-native-rust-builder:
    restart: "no"
    image: kaithem-native-rust-builder:${KAITHEM_VERSION:?error}
    build:
      context: ../../
      dockerfile: KaithemAutomation/docker/native-rust-builder/Dockerfile
